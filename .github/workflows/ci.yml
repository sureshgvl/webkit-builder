name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run validate

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [demo-travel, demo-travel-elegant, demo-cab, searchcab]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          CLIENT: ${{ matrix.client }}

  browser-tests:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Showcase demo (demo-travel)
        run: npm run build && npm run test:showcase -- screenshots && npm run screenshots -- screenshots/demo-travel
        env:
          CLIENT: demo-travel
      - name: Plain client site (demo-travel-elegant)
        run: npm run build && npm run screenshots -- screenshots/demo-travel-elegant
        env:
          CLIENT: demo-travel-elegant
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/

  platform:
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Database schema + access rules (Supabase-like roles)
        run: |
          psql -v ON_ERROR_STOP=1 -c "create role anon nologin" -c "create role authenticated nologin" -c "create role service_role nologin bypassrls"
          psql -v ON_ERROR_STOP=1 -c "grant usage on schema public to anon, authenticated, service_role" \
            -c "alter default privileges in schema public grant all on tables to anon, authenticated, service_role" \
            -c "alter default privileges in schema public grant all on sequences to anon, authenticated, service_role" \
            -f supabase/migrations/20261006000000_sites.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls_test.sql
      - run: npm run build:platform
