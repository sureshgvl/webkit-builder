name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run validate

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [demo-travel, demo-travel-elegant, demo-cab, searchcab]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          CLIENT: ${{ matrix.client }}

  browser-tests:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Showcase demo (demo-travel)
        run: npm run build && npm run test:showcase -- screenshots && npm run screenshots -- screenshots/demo-travel
        env:
          CLIENT: demo-travel
      - name: Plain client site (demo-travel-elegant)
        run: npm run build && npm run screenshots -- screenshots/demo-travel-elegant
        env:
          CLIENT: demo-travel-elegant
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/

  platform:
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Database schema + access rules (Supabase-like roles)
        run: |
          psql -v ON_ERROR_STOP=1 -c "create role anon nologin" -c "create role authenticated nologin" -c "create role service_role nologin bypassrls"
          psql -v ON_ERROR_STOP=1 -c "grant usage on schema public to anon, authenticated, service_role" \
            -c "alter default privileges in schema public grant all on tables to anon, authenticated, service_role" \
            -c "alter default privileges in schema public grant all on sequences to anon, authenticated, service_role" \
            -f supabase/migrations/20261006000000_sites.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls_test.sql
      - run: npm run build:platform
      - run: npm run build:backend
      - name: Backend API test (admin login, sites, photos, preview, publish, domains, history)
        env:
          PGDATABASE: postgres
        run: |
          node backend/test/fakes.mjs &
          BACKEND_URL=http://127.0.0.1:4000 REVALIDATE_SECRET=ci-rv SUPABASE_URL=http://127.0.0.1:3600 SUPABASE_ANON_KEY=anon-key \
            ASSETS_BASE_URL=http://127.0.0.1:3600/r2 npm run start:platform -- -p 3000 &
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres SUPABASE_URL=http://127.0.0.1:3600 SUPABASE_ANON_KEY=anon-key \
            ADMIN_EMAILS=admin@test.in R2_BUCKET=b R2_ENDPOINT=http://127.0.0.1:3600/s3 R2_ACCESS_KEY_ID=k R2_SECRET_ACCESS_KEY=s \
            ASSETS_BASE_URL=http://127.0.0.1:3600/r2 WEBSITE_URL=http://127.0.0.1:3000 REVALIDATE_SECRET=ci-rv PREVIEW_SECRET=ci-pv \
            PLATFORM_DOMAIN=localhost PORT=4000 npm run start:backend &
          for i in $(seq 60); do curl -sf http://127.0.0.1:4000/health && curl -s -o /dev/null http://127.0.0.1:3000/ && break; sleep 1; done
          node backend/test/api.test.mjs
