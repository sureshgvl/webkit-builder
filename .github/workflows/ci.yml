name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run validate

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [demo-travel, demo-travel-elegant, demo-cab, searchcab]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          CLIENT: ${{ matrix.client }}

  browser-tests:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Showcase demo (demo-travel)
        run: npm run build && npm run test:showcase -- screenshots && npm run screenshots -- screenshots/demo-travel
        env:
          CLIENT: demo-travel
      - name: Plain client site (demo-travel-elegant)
        run: npm run build && npm run screenshots -- screenshots/demo-travel-elegant
        env:
          CLIENT: demo-travel-elegant
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
